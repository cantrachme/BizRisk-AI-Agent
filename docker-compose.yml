version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bizrisk-db
    environment:
      POSTGRES_USER: bizrisk
      POSTGRES_PASSWORD: bizrisk
      POSTGRES_DB: bizrisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bizrisk-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
